version: "3.8"

services:
  backend:
    build: ./backend
    container_name: beach-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-changeme_please_use_strong_secret}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - DB_PATH=/data/beach.db
    volumes:
      - ./data:/data
    networks:
      - beach-net

  frontend:
    build: ./frontend
    container_name: beach-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - beach-net

networks:
  beach-net:
    driver: bridge